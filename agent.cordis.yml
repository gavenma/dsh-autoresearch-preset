# The `standard` agent preset: the full coding agent, mounted once per process.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a research coordinator powered by the {{model}} model, running the AutoResearch mode on the DeepSeek Harness. 

      You orchestrate evidence-grounded research through AutoResearch Project Mode. Planning may use either the standard vague-brief skill or the outline-led planning skill; both must produce an approved canonical plan DAG (kind-tagged, no schemaVersion, object acceptance criteria) and then share the same execution: plan-mode approval, one Linear issue per node, one independent AutoReason loop per node in dependency order, then merge and re-verify all leaf finals in an integration loop before the project final. Fresh role subagents, each on its own narrow tool-name allowlist, flow through an AutoReason A/B/AB refinement loop with blind Borda judging. Internal artifacts under the single runtime root .research-agent hold the immutable plan authority and operational receipts; only completed user-facing deliverables are published under outputs/<projectId>/. A bare research-agent/ directory is a migration input, never a runtime alternative — if the runtime refuses the workspace for it, point the user at scripts/migrate-workspace.mjs in the preset's SOURCE checkout (the installed runtime ships no scripts/). Keep your context thin and checkpoint after every promoted artifact. Roles run through autoresearch_run_role; never hand them your own tools. Before dispatching a run, run autoresearch_dependency_preflight once per project (pass runDir once runs exist) and surface every blocker with its remediation; role tooling stays on narrow profiles because autoresearch_capability_probe is coordinator-adapter diagnostics and cannot attest the unavailable role-child preventive boundary. Never fabricate sources, and redact-check output before posting. plan.json is the immutable approved DAG and contract authority; state.json is the operational receipt journal (digests, ids, statuses — never a narrative context copy); in Linear mode, the issue's Current Node Context is authoritative current-work context, while Linear must never rewrite plan.json. Linear-backed nodes keep their narrative Current Node Context block in the issue description itself; before claim/complete/reopen, read it with linear_get_node_context and carry the fresh contextDigest — a stale digest is refused. User feedback after publication: autoresearch_submit_feedback records the hash-addressed intake (userAuthority computed against the last-known-good integration), autoresearch_record_feedback_triage derives the smallest responsible reopen closure, autoresearch_revision_request executes the multi-target causal reopen, and autoresearch_close_feedback verifies the repair against the current last-known-good before recording the resolved version and republish event.

      Approval authority: before any change in these classes — plan — STOP and return a structured approval request (paths, diff summary, reason, affected criteria, rollback plan). The path/operation guard is a post-attempt mutation audit, not a read or egress sandbox; this instruction grants nothing.

      Bash sandbox discipline: on ordinary Bash calls, omit sandbox_permissions and justification entirely. Supply those fields only when retrying the exact command after a sandbox denial, using a strictly wider mode and a non-empty one-sentence justification. Never request escalation speculatively.
    suffix: Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal SERVICE and its session driver stay on the host plane: the Gateway
# serves the goal domain as Remote endpoints whose receiver comes from a
# generated descriptor, so it resolves `goals` on the host and an entry-local
# realm here would hide it. The registry is keyed by session anyway, so one host
# instance serves every session. What a preset chooses is the two model- and
# human-facing surfaces: the tool an agent calls, and the command a human types.
#
# BOTH rows are required here. The `web` profile deliberately DISABLES the
# host-plane `command-goal`/`tool-goal` rows (`dsh-web-app/cordis.patch.yml`,
# "Presets own the human command and model-facing tool"), so in a web session a
# preset that declares only `tool-goal` leaves `/goal` unregistered and the
# GoalBar surface unreachable. `standard` declares both rows for exactly this
# reason. A non-web profile that keeps the base rows enabled still composes:
# this row registers into the preset's own command layer, which shadows rather
# than collides.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        # Deliberate deployment routing, NOT copied boilerplate. The package
        # defaults are threshold 0.8 / retain 0.16; every entry below is a
        # measured override for a route this deployment actually serves, and
        # the two local routes additionally cap summarization output.
        #
        # Cost of a stale entry is bounded, which is why these stay: a policy
        # whose provider/model is renamed simply stops matching and that route
        # falls back to the package default, while an entry for a route nobody
        # runs is inert. If you retire a route, delete its entry here too.
        modelPolicies:
          - provider: deepseek-official
            model: deepseek-v4-flash
            thresholdRatio: 0.6
            retainRatio: 0.12
          - provider: local-qwen-fp8
            model: qwen3.8-27b-fp8
            thresholdRatio: 0.6
            retainRatio: 0.1
            maxOverflowRetries: 2
            # Checkpoint summarization output cap (CoT + summary text).
            maxTokens: 32768
          - provider: local-qwen-uncensored
            model: qwen3.8-27b-uncensored
            thresholdRatio: 0.6
            retainRatio: 0.1
            maxOverflowRetries: 2
            maxTokens: 32768

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    # `modelSelectionSettings: true` is what exposes the provider/model/
    # reasoning_effort fields on this tool. It is an opt-in: without it the row
    # registers a tool with no route arguments, so the host's
    # `subagent-model-selection` settings (allowedModels, enabled) stay inert
    # for every child this preset starts. Enabling it requires the host-scope
    # `@deepseek-ai/dsh-tool-subagent/model-selection-settings` row, which the
    # `web` profile mounts.
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable
        toolFilter:
          deny: [ ask_user_question ]

    # Fork deliberately omits `modelSelectionSettings`: the child inherits the
    # parent route so the copied history stays eligible for KV-cache reuse, and
    # a route override would forfeit that.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
        toolFilter:
          deny: [ ask_user_question ]

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The 0.1.5 delivered-file surface. `present` declares files that already exist
# under `outputs/<projectId>/` as final deliverables, appending
# `deliverables/presented` to the session log that the Sidebar preview and the
# "open in" flow read. It registers a tool and provides nothing, so it needs no
# realm; it injects the host `tools`/`fs`/`sessionProjections` services.
#
# This row is NOT optional for this preset. Only the preset mounts it (the base
# bundle does not), so without it the one artifact class this mode exists to
# produce — completed user-facing deliverables — never reaches the handler the
# user reads the run through.
- id: present
  name: '@deepseek-ai/dsh-tool-present'

# The standard web tools, mounted as the preset's DEFAULT way to reach the
# internet: `web_search` for discovery and `web_fetch` for ordinary pages.
# Standard-first is the policy — the host provider owns the deployment's
# address safety, proxy routing, and content decoding, so nothing here should
# re-implement an ordinary fetch.
#
# The `web` service, its search provider, AND its fetch provider all stay on
# the host plane. 0.1.5's base bundle mounts `@deepseek-ai/dsh-web-fetch-http`
# (provider id `http`) for every profile, and `web.fetch()` — like this
# preset's own dependency preflight — resolves that capability by requiring
# EXACTLY ONE usable provider: two registered providers raise
# `WEB_PROVIDER_AMBIGUOUS`, and the preflight reports a blocker the operator
# cannot clear from the workspace. This preset therefore mounts NO fetch
# provider; `./tools/research-web-fetch.mjs` remains as the optional row for a
# deployment whose host mounts none.
#
# `web_fetch` cannot return a PDF or another unsupported content type: the
# host provider's body union is a closed `html | text`. For those the
# coordinator falls back to `autoresearch_fetch_source`, which extracts PDF
# text directly. Ordinary retrieval never needs it.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── AutoResearch: the research orchestrator + Linear intake tools ──────────

# Both rows consume host services only (fs/web/subagents/agents/credentials/
# subprocess) and publish nothing, so they need no isolate realm.
- id: tool-autoresearch
  name: ./tools/research-orchestrator-b21ee0e34cdd.mjs

- id: tool-linear
  name: ./tools/linear-b21ee0e34cdd.mjs

