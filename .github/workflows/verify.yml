name: Verify preset (full test suite)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Gate 16: CI runs the FULL test suite (build + snapshot + every test),
      # not snapshot verification alone.
      - run: npm test
